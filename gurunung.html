<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurunung - Motor Trail Gurun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .game-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
        }
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,215,0,0.5);
            pointer-events: none;
            z-index: 10;
        }
        .hud span {
            color: #ffd966;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            pointer-events: none;
        }
        .btn {
            background: rgba(0,0,0,0.6);
            border: 2px solid #ffd966;
            color: #ffd966;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn:hover {
            background: #ffd966;
            color: #1a1a1a;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .info {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            border: 1px solid rgba(255,215,0,0.3);
            z-index: 10;
            pointer-events: none;
        }
        .info i {
            color: #ffd966;
            font-style: normal;
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="1100" height="600"></canvas>
    <div class="hud">🏁 SKOR: <span id="scoreDisplay">0</span> | 🏆 TERBAIK: <span id="bestDisplay">0</span></div>
    <div class="info">🏜️ GURUNUNG | 🕋 KA'BAH | 👥 PENONTON</div>
    <div class="controls">
        <button class="btn" id="restartBtn">🔄 MULAI ULANG</button>
    </div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const bestDisplay = document.getElementById('bestDisplay');

        // ========== KONFIGURASI ==========
        const CANVAS_W = 1100, CANVAS_H = 600;
        const GROUND_Y = 480; // dasar tanah gurun
        const GRAVITY = 0.55;
        const JUMP_FORCE = -11;
        const MIN_SPEED = 4.5;
        const MAX_SPEED = 8.5;

        // ========== STATE ==========
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('gurunungBest')) || 0;
        bestDisplay.textContent = bestScore;

        let speed = 5.2;
        let gameOver = false;
        let frame = 0;
        let cameraX = 0;

        // ========== MOTOR TRAIL (PEMAIN) ==========
        const player = {
            x: 180,
            y: GROUND_Y - 48,
            w: 85,
            h: 48,
            vy: 0,
            onGround: true,
            rotation: 0,
            wheelie: 0
        };

        // ========== RINTANGAN ==========
        let obstacles = [];
        let obstacleSpawnTimer = 0;
        const MIN_OBS_SPAWN = 55;
        const MAX_OBS_SPAWN = 110;

        // ========== PARTIKEL DEBU ==========
        let particles = [];

        // ========== PENONTON (background berjalan) ==========
        const crowdColors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#e84393', '#fd79a8', '#00cec9'];
        let crowdOffset = 0;

        // ========== MAPS / LATAR BERAGAM ==========
        // Setiap map punya warna langit, pasir, dan aksen berbeda
        const maps = [
            { name: 'Padang Pasir', skyTop: '#f9d976', skyBottom: '#f39c12', sand: '#edc38b', dune: '#d4a373', accent: '#b87d3b' },
            { name: 'Gurun Senja', skyTop: '#ff9a76', skyBottom: '#c44536', sand: '#e6b87e', dune: '#c99a5e', accent: '#a56b2c' },
            { name: 'Malam Gurun', skyTop: '#2c3e50', skyBottom: '#1a2634', sand: '#8b7a5a', dune: '#6b5d44', accent: '#4a3f2e' },
            { name: 'Gurun Emas', skyTop: '#f7dc6f', skyBottom: '#d4ac0d', sand: '#f0d28c', dune: '#dbb85c', accent: '#b8942e' },
            { name: 'Oase', skyTop: '#a8e6cf', skyBottom: '#3b8d6b', sand: '#e0cfa5', dune: '#c4b48a', accent: '#8f7f5e' }
        ];
        let currentMapIndex = 0;

        // ========== GANTI MAP SETIAP 30 DETIK ==========
        let mapTimer = 0;

        // ========== GAMBAR KA'BAH (DIGAMBAR ULANG SETIAP FRAME) ==========
        function drawKaaba(x, y, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            // Badan Ka'bah hitam
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(-30, -70, 60, 70);
            // Kilau emas
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(-30, -70, 60, 8);
            ctx.fillRect(-30, -40, 60, 6);
            // Pintu emas
            ctx.fillStyle = '#b8860b';
            ctx.fillRect(-8, -55, 16, 25);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(-6, -52, 12, 18);
            // Hajar Aswad
            ctx.fillStyle = '#2c2c2c';
            ctx.beginPath();
            ctx.arc(22, -25, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Kiswah (kain hitam dengan kaligrafi emas)
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(-30, -70, 60, 70);
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 8px serif';
            ctx.textAlign = 'center';
            ctx.fillText('﷽', 0, -30);
            ctx.fillText('ﷲ', 0, -15);
            // Atap
            ctx.fillStyle = '#2c2c2c';
            ctx.fillRect(-32, -74, 64, 6);
            ctx.restore();
        }

        // ========== GAMBAR PENONTON ==========
        function drawCrowd() {
            const baseY = GROUND_Y - 20;
            // Baris penonton di kiri dan kanan Ka'bah (di latar belakang)
            for (let i = 0; i < 24; i++) {
                const seed = i * 13.7;
                const x = ((i * 55 + crowdOffset * 0.3) % 1300) - 150;
                if (x > 100 && x < 1000) continue; // hindari area Ka'bah
                const heightVar = Math.sin(seed) * 6;
                const color = crowdColors[Math.floor(Math.abs(Math.sin(seed)) * crowdColors.length)];
                ctx.fillStyle = color;
                // Badan penonton
                ctx.beginPath();
                ctx.ellipse(x, baseY + heightVar - 8, 10, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                // Kepala
                ctx.fillStyle = '#f5d0b0';
                ctx.beginPath();
                ctx.arc(x, baseY + heightVar - 28, 8, 0, Math.PI * 2);
                ctx.fill();
                // Rambut
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                ctx.arc(x, baseY + heightVar - 32, 8, Math.PI, 0);
                ctx.fill();
                // Tangan melambai (animasi)
                if (Math.sin(frame * 0.1 + i) > 0) {
                    ctx.strokeStyle = '#f5d0b0';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x - 8, baseY + heightVar - 18);
                    ctx.lineTo(x - 18, baseY + heightVar - 30);
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = '#f5d0b0';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x + 8, baseY + heightVar - 18);
                    ctx.lineTo(x + 18, baseY + heightVar - 30);
                    ctx.stroke();
                }
            }
        }

        // ========== GAMBAR BACKGROUND GURUN + KA'BAH ==========
        function drawBackground() {
            const map = maps[currentMapIndex];
            // Langit gradasi
            const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            grad.addColorStop(0, map.skyTop);
            grad.addColorStop(1, map.skyBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, CANVAS_W, GROUND_Y + 40);

            // Matahari
            ctx.fillStyle = 'rgba(255, 220, 100, 0.9)';
            ctx.beginPath();
            ctx.arc(900, 100, 55, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 200, 50, 0.4)';
            ctx.beginPath();
            ctx.arc(900, 100, 75, 0, Math.PI * 2);
            ctx.fill();

            // Awan tipis
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath();
            ctx.ellipse(200, 80, 80, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(700, 130, 100, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bukit pasir (dune) berlapis
            ctx.fillStyle = map.dune;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y - 30);
            for (let x = 0; x <= CANVAS_W; x += 40) {
                ctx.lineTo(x, GROUND_Y - 30 - Math.sin(x * 0.01 + frame * 0.002) * 20 - 10);
            }
            ctx.lineTo(CANVAS_W, GROUND_Y + 20);
            ctx.lineTo(0, GROUND_Y + 20);
            ctx.fill();

            // Ka'bah di tengah belakang (dengan skala dan posisi tetap)
            drawKaaba(700, GROUND_Y - 70, 1.3);

            // Pasir depan
            ctx.fillStyle = map.sand;
            ctx.fillRect(0, GROUND_Y - 5, CANVAS_W, 40);

            // Tekstur pasir (titik-titik)
            ctx.fillStyle = map.accent;
            for (let i = 0; i < 60; i++) {
                const sx = (i * 37 + crowdOffset * 0.5) % (CANVAS_W + 200) - 100;
                const sy = GROUND_Y + 5 + Math.sin(i) * 12;
                ctx.beginPath();
                ctx.arc(sx, sy, 1.5 + Math.sin(i * 2) * 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ========== GAMBAR MOTOR TRAIL ==========
        function drawMotorcycle(x, y, w, h, isPlayer = false, wheelieAngle = 0) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            if (isPlayer) {
                ctx.rotate(wheelieAngle * 0.3);
            }
            const hw = w / 2;
            const hh = h / 2;

            // Roda belakang
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(-hw + 18, hh - 8, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-hw + 18, hh - 8, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#666';
            ctx.beginPath();
            ctx.arc(-hw + 18, hh - 8, 5, 0, Math.PI * 2);
            ctx.fill();

            // Roda depan
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(hw - 18, hh - 8, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(hw - 18, hh - 8, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#666';
            ctx.beginPath();
            ctx.arc(hw - 18, hh - 8, 5, 0, Math.PI * 2);
            ctx.fill();

            // Rangka motor
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-hw + 18, hh - 10);
            ctx.lineTo(-hw + 30, hh - 35);
            ctx.lineTo(hw - 30, hh - 35);
            ctx.lineTo(hw - 18, hh - 10);
            ctx.stroke();

            // Tangki
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.ellipse(0, hh - 38, 22, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Jok
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.ellipse(-10, hh - 32, 16, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Setang
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(hw - 28, hh - 48);
            ctx.lineTo(hw - 10, hh - 55);
            ctx.stroke();

            // Knalpot
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.ellipse(-hw + 5, hh - 20, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // ========== PENGEMUDI ==========
            if (isPlayer) {
                // Badan pengemudi
                ctx.fillStyle = '#2980b9';
                ctx.beginPath();
                ctx.ellipse(0, hh - 55, 12, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                // Kepala
                ctx.fillStyle = '#f5d0b0';
                ctx.beginPath();
                ctx.arc(0, hh - 78, 11, 0, Math.PI * 2);
                ctx.fill();

                // Helm
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.arc(0, hh - 81, 12, Math.PI, 0);
                ctx.fill();
                ctx.fillRect(-12, hh - 81, 24, 6);
                // Visor
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.ellipse(0, hh - 76, 8, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tangan
                ctx.strokeStyle = '#f5d0b0';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(-6, hh - 60);
                ctx.lineTo(hw - 28, hh - 50);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(6, hh - 60);
                ctx.lineTo(hw - 18, hh - 52);
                ctx.stroke();

                // Kaki
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.moveTo(-8, hh - 38);
                ctx.lineTo(-14, hh - 12);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(8, hh - 38);
                ctx.lineTo(14, hh - 12);
                ctx.stroke();
            } else {
                // Pengemudi untuk motor rintangan (lebih sederhana)
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath();
                ctx.ellipse(0, hh - 55, 10, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f5d0b0';
                ctx.beginPath();
                ctx.arc(0, hh - 75, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#34495e';
                ctx.beginPath();
                ctx.arc(0, hh - 78, 10, Math.PI, 0);
                ctx.fill();
            }

            ctx.restore();
        }

        // ========== GAMBAR RINTANGAN (MOTOR TRAIL LAIN) ==========
        function drawObstacle(obs) {
            drawMotorcycle(obs.x, obs.y, obs.w, obs.h, false, 0);
            // Efek debu
            ctx.fillStyle = 'rgba(200, 180, 140, 0.5)';
            ctx.beginPath();
            ctx.arc(obs.x + 10, obs.y + obs.h - 5, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        // ========== PARTIKEL DEBU ==========
        function spawnDust(x, y) {
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: x + Math.random() * 40 - 20,
                    y: y + Math.random() * 10,
                    vx: -2 - Math.random() * 4,
                    vy: -1 - Math.random() * 2,
                    life: 1.0,
                    size: 4 + Math.random() * 8,
                    color: `rgba(210, 180, 140, ${0.6 + Math.random() * 0.3})`
                });
            }
        }

        // ========== UPDATE PARTIKEL ==========
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life -= 0.02;
                p.size *= 0.99;
                if (p.life <= 0 || p.x < -50) {
                    particles.splice(i, 1);
                }
            }
        }

        // ========== GAMBAR PARTIKEL ==========
        function drawParticles() {
            for (const p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life * 0.8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        // ========== SPAWN RINTANGAN ==========
        function spawnObstacle() {
            const obsW = 70 + Math.random() * 30;
            const obsH = 40 + Math.random() * 15;
            obstacles.push({
                x: CANVAS_W + 100,
                y: GROUND_Y - obsH + 10,
                w: obsW,
                h: obsH,
                speed: 1.5 + Math.random() * 2.5,
                passed: false
            });
        }

        // ========== UPDATE GAME ==========
        function update() {
            if (gameOver) return;

            // Ganti map setiap 30 detik
            mapTimer++;
            if (mapTimer > 1800) { // ~30 detik pada 60fps
                mapTimer = 0;
                currentMapIndex = (currentMapIndex + 1) % maps.length;
            }

            // Update skor berdasarkan jarak
            score += 0.1;
            scoreDisplay.textContent = Math.floor(score);

            // Update crowd offset untuk animasi
            crowdOffset += speed * 0.5;

            // Kecepatan bertambah seiring skor
            speed = Math.min(MAX_SPEED, MIN_SPEED + score * 0.0008);

            // Fisika pemain
            player.vy += GRAVITY;
            player.y += player.vy;

            // Ground collision
            if (player.y >= GROUND_Y - player.h) {
                player.y = GROUND_Y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.wheelie *= 0.9;
            } else {
                player.onGround = false;
            }

            // Efek wheelie saat di tanah
            if (player.onGround && frame % 3 === 0) {
                player.wheelie = Math.min(0.4, player.wheelie + 0.02);
            }
            if (!player.onGround) {
                player.wheelie = Math.max(-0.3, player.wheelie - 0.02);
            }

            // Spawn debu
            if (player.onGround && frame % 4 === 0) {
                spawnDust(player.x, player.y + player.h - 10);
            }

            // Update partikel
            updateParticles();

            // Spawn rintangan
            obstacleSpawnTimer--;
            if (obstacleSpawnTimer <= 0) {
                spawnObstacle();
                obstacleSpawnTimer = Math.floor(MIN_OBS_SPAWN + Math.random() * (MAX_OBS_SPAWN - MIN_OBS_SPAWN));
            }

            // Update rintangan
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= speed + obs.speed * 0.3;

                // Deteksi tabrakan
                const playerBox = {
                    x: player.x + 10,
                    y: player.y + 5,
                    w: player.w - 20,
                    h: player.h - 10
                };
                const obsBox = {
                    x: obs.x + 8,
                    y: obs.y + 5,
                    w: obs.w - 16,
                    h: obs.h - 10
                };

                if (playerBox.x < obsBox.x + obsBox.w &&
                    playerBox.x + playerBox.w > obsBox.x &&
                    playerBox.y < obsBox.y + obsBox.h &&
                    playerBox.y + playerBox.h > obsBox.y) {
                    // Game over
                    gameOver = true;
                    if (Math.floor(score) > bestScore) {
                        bestScore = Math.floor(score);
                        localStorage.setItem('gurunungBest', bestScore);
                        bestDisplay.textContent = bestScore;
                    }
                }

                // Skor tambahan saat melewati rintangan
                if (!obs.passed && obs.x + obs.w < player.x) {
                    obs.passed = true;
                    score += 15;
                    scoreDisplay.textContent = Math.floor(score);
                }

                // Hapus rintangan yang keluar layar
                if (obs.x + obs.w < -100) {
                    obstacles.splice(i, 1);
                }
            }

            frame++;
        }

        // ========== GAMBAR SEMUA ==========
        function draw() {
            // Background gurun + Ka'bah + penonton
            drawBackground();
            drawCrowd();

            // Gambar rintangan (motor trail lain)
            for (const obs of obstacles) {
                drawObstacle(obs);
            }

            // Gambar pemain (motor trail + pengemudi)
            drawMotorcycle(player.x, player.y, player.w, player.h, true, player.wheelie);

            // Partikel debu
            drawParticles();

            // Efek garis kecepatan
            if (speed > 6) {
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 8; i++) {
                    const ly = 100 + i * 60 + Math.sin(frame * 0.1 + i) * 10;
                    ctx.beginPath();
                    ctx.moveTo(0, ly);
                    ctx.lineTo(80 + Math.sin(frame * 0.2 + i) * 30, ly);
                    ctx.stroke();
                }
            }

            // Game over overlay
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                ctx.fillStyle = '#ffd966';
                ctx.font = 'bold 60px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CANVAS_W / 2, CANVAS_H / 2 - 40);
                ctx.font = '30px "Segoe UI", sans-serif';
                ctx.fillStyle = '#fff';
                ctx.fillText('Skor: ' + Math.floor(score), CANVAS_W / 2, CANVAS_H / 2 + 30);
                ctx.font = '22px "Segoe UI", sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Klik "MULAI ULANG" untuk bermain lagi', CANVAS_W / 2, CANVAS_H / 2 + 90);
            }

            // Nama map di pojok kiri bawah
            ctx.font = 'bold 16px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.textAlign = 'left';
            ctx.fillText('🗺️ ' + maps[currentMapIndex].name, 20, CANVAS_H - 20);

            // Judul "GURUNUNG"
            ctx.font = 'bold 24px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255,215,0,0.8)';
            ctx.textAlign = 'right';
            ctx.fillText('GURUNUNG', CANVAS_W - 25, 45);
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fillText('Motor Trail Gurun', CANVAS_W - 25, 68);
        }

        // ========== GAME LOOP ==========
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ========== KONTROL ==========
        function jump() {
            if (gameOver) return;
            if (player.onGround) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
                player.wheelie = -0.3;
                // Efek debu saat lompat
                for (let i = 0; i < 8; i++) {
                    spawnDust(player.x + 20, player.y + player.h - 5);
                }
            }
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                jump();
            }
            if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        // Mouse / Touch
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        // Restart button
        document.getElementById('restartBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        // ========== RESET GAME ==========
        function resetGame() {
            score = 0;
            speed = 5.2;
            gameOver = false;
            frame = 0;
            obstacles = [];
            particles = [];
            obstacleSpawnTimer = 40;
            mapTimer = 0;
            currentMapIndex = 0;
            player.y = GROUND_Y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.wheelie = 0;
            scoreDisplay.textContent = '0';
        }

        // ========== INISIALISASI ==========
        resetGame();
        gameLoop();
    })();
</script>
</body>
</html>
